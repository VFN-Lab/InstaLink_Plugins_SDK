<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample Native Basic</title>
  <style>
    body { font-family: Segoe UI, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 40px; }
    .card { background: #fff; border: 1px solid #dbe3ee; border-radius: 20px; padding: 18px; margin-bottom: 16px; box-shadow: 0 14px 28px rgba(15, 23, 42, 0.06); }
    h1, h2 { margin: 0 0 10px; }
    p { color: #475569; line-height: 1.7; }
    textarea { width: 100%; min-height: 140px; padding: 12px; border-radius: 16px; border: 1px solid #cbd5e1; font: inherit; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    button { border: 0; border-radius: 14px; background: #0f172a; color: #fff; padding: 10px 14px; font-weight: 700; cursor: pointer; }
    button.secondary { background: #e2e8f0; color: #1e293b; }
    pre { background: #111827; color: #f9fafb; padding: 14px; border-radius: 16px; min-height: 220px; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card">
      <h1>Sample Native Basic</h1>
      <p>This template proves the external native extension workflow without requiring the app source.</p>
    </section>

    <section class="card">
      <h2>Payload</h2>
      <textarea id="payloadInput">Hello from an external InstaLink native extension.</textarea>
      <div class="actions">
        <button id="inspectButton">Inspect</button>
        <button id="echoButton">Echo</button>
        <button id="reverseButton" class="secondary">Reverse</button>
        <button id="uppercaseButton" class="secondary">Uppercase</button>
      </div>
    </section>

    <section class="card">
      <h2>Result</h2>
      <pre id="resultLog">Waiting for InstaLink.nativeRuntime...</pre>
    </section>
  </div>

  <script>
    (function init(attempt) {
      var logNode = document.getElementById("resultLog");
      function render(value) {
        logNode.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
      }

      var ready = !!(window.InstaLink && window.InstaLink.nativeRuntime && window.InstaLink.__nativeReady);
      if (!ready) {
        if ((attempt || 0) > 50) {
          render({ ok: false, error: "bridge_unavailable" });
          return;
        }
        return setTimeout(function () { init((attempt || 0) + 1); }, 120);
      }

      var extensionId = window.InstaLinkActiveExtension || "sample.native.basic";
      var payloadInput = document.getElementById("payloadInput");

      function invoke(action) {
        var payload = String(payloadInput.value || "");
        var raw = window.InstaLink.nativeRuntime.invoke(extensionId, action, { message: payload });
        render(raw);
      }

      document.getElementById("inspectButton").addEventListener("click", function () {
        render(window.InstaLink.nativeRuntime.inspect(extensionId));
      });
      document.getElementById("echoButton").addEventListener("click", function () { invoke("echo"); });
      document.getElementById("reverseButton").addEventListener("click", function () { invoke("reverse"); });
      document.getElementById("uppercaseButton").addEventListener("click", function () { invoke("uppercase"); });

      render({ ok: true, ready: true, extensionId: extensionId });
    })();
  </script>
</body>
</html>
